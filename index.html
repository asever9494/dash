<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗GPT에서 GitHub 배포 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      text-align: center;
      background: rgba(255,255,255,0.15);
      padding: 50px 70px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 { font-size: 40px; margin-bottom: 15px; }
    p { font-size: 18px; margin-bottom: 25px; }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #667eea;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 배포 성공!</h1>
    <p>챗GPT에서 GitHub에 파일을 올려서 HTML 파일이 정상적으로 실행되고 있다.</p>
    <button onclick="showMessage()">테스트 버튼</button>
  </div>

  <script>
    function showMessage() {
      alert("HTML + JavaScript 정상 작동!");
    }
  </script>
</body>
</html>
